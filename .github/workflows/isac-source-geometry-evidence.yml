name: Complete ISAC source geometry evidence (not full reproduction)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  full11200-source-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the tested arbitrary-precision runtime
        run: python -m pip install -r tools/isac-source-geometry-audit/requirements.txt
      - name: Every original primitive, exact geometry pair, full NoRIS field and 32 controls
        run: python -B tools/isac-source-geometry-audit/replay_full_evidence.py --output-dir "${{ runner.temp }}/isac-full-source-geometry"
      - name: Retain complete fresh numerical reports and rejected controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isac-full11200-23900-source-geometry-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/isac-full-source-geometry/summary.json
            ${{ runner.temp }}/isac-full-source-geometry/progress.json
            ${{ runner.temp }}/isac-full-source-geometry/complete-original11200-and23900-geometry-replay.json
            ${{ runner.temp }}/isac-full-source-geometry/complete-four-NoRIS-source-variant-field-replay.json
            ${{ runner.temp }}/isac-full-source-geometry/actual17-exact-geometry-controls.json
            ${{ runner.temp }}/isac-full-source-geometry/actual9-NoRIS-field-controls.json
            ${{ runner.temp }}/isac-full-source-geometry/actual6-transport-controls.json
            ${{ runner.temp }}/isac-full-source-geometry/fresh-NoRIS/**
            ${{ runner.temp }}/isac-full-source-geometry/exact-geometry-controls/**
            ${{ runner.temp }}/isac-full-source-geometry/NoRIS-field-controls/**
