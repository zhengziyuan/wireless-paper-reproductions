name: Complete preserved ISAC legacy records (qualified audit)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  preserved49-legacy-records:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the tested numeric and arbitrary-precision runtime
        run: python -m pip install -r tools/isac-legacy-record-audit/requirements.txt
      - name: Every preserved MAT and CSV record, complete initial MP field and 27 controls
        run: python -B tools/isac-legacy-record-audit/replay_full_evidence.py --output-dir "${{ runner.temp }}/isac-preserved-legacy-records"
      - name: Retain complete numerical records, full MP matrices and rejected controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isac-preserved49-complete1000-table-and-initial-fields-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/isac-preserved-legacy-records/summary.json
            ${{ runner.temp }}/isac-preserved-legacy-records/progress.json
            ${{ runner.temp }}/isac-preserved-legacy-records/fresh-records/**
            ${{ runner.temp }}/isac-preserved-legacy-records/fresh-physical/**
            ${{ runner.temp }}/isac-preserved-legacy-records/record-controls/**
            ${{ runner.temp }}/isac-preserved-legacy-records/physical-controls/**
            ${{ runner.temp }}/isac-preserved-legacy-records/actual6-transport-and-source-scope-controls.json
