name: Superseded preview checks (not strict reproduction)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reduced-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_python.py --legacy-preview
      - run: python scripts/validate_python.py
      # MATLAB parity is a separate local licensed-runtime check, not this CI job.
