name: Original-algorithm component checks (not full reproduction)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r strict/requirements.txt
      - run: python strict/validate_components.py --output-dir strict/outputs/ci-components
      - run: python strict/rotatable-isac/test_metadata.py
      - name: Exact raw-PR ascent counterexample (not a paper-scene run)
        run: python strict/validation/rotatable-isac-raw-pr-scope-v1/test_exact_raw_pr.py --output strict/outputs/ci-raw-pr-scope/actual-exact-component.json
      - run: python strict/two-timescale-ma/test_metadata.py
      - run: python strict/test_validation.py
      - name: All MIS start-summary slots (not independent physical certification)
        run: python strict/test_mis_population_evidence.py
      - name: RIS per-target evidence transport (no optimization)
        run: python strict/test_mis_ris_evidence.py
      - name: Complete command inventory and host controls (no scientific execution)
        run: python tools/full-controller/test_controller.py .
      - name: Missing-job recovery preserves old failures (host controls only)
        run: python tools/resume-campaign/test_recovery.py
      - name: Independent native moment/transport controls (not optimization)
        run: |
          python -m pip install -r tools/hotspot-native-replay/requirements.txt
          python tools/hotspot-native-replay/test_physical_oracle.py
      - name: Restore actual saved18 numerical inputs (no producer rerun)
        run: python tools/hotspot-native-replay/unpack_saved_inputs.py --archive strict/validation/hotspot-native18-replay-20261017/native18-saved-inputs.tar.gz --output-dir strict/outputs/ci-native-statistical-endpoints/unpacked
      - name: Actual all243 native endpoint metrics MP80/MP100 (not full inner trajectories)
        run: python tools/hotspot-native-replay/audit_endpoint_mp.py --bank strict/outputs/ci-native-statistical-endpoints/unpacked/native18-saved-inputs/bank --contexts strict/outputs/ci-native-statistical-endpoints/unpacked/native18-saved-inputs/contexts --output-dir strict/outputs/ci-native-statistical-endpoints/mp-audit
      - name: Actual saved full12000 MIS summaries and renderer (not fresh optimization)
        run: python strict/validation/mis-summary-population-gate-v2/audit_saved_bank.py --output-dir strict/outputs/ci-mis-summary-replay
      - run: python -m unittest discover -s strict -p test_figures.py
      - run: python strict/test_satellite_figures.py
      - run: python strict/test_reproduction_plans.py
      - name: Parameter-table route and source guards (metadata only)
        run: python strict/test_table_reproduction.py
      - name: Source-qualified parameter mappings (not full figure certification)
        run: python strict/validation/parameter-tables-source-qualified-v1/audit_tables.py --output strict/outputs/ci-parameter-tables/actual-canonical-parameter-replay.json
      - run: python strict/test_hotspot_element_count.py
      - run: python strict/test_hotspot_statistical_reference.py
      - run: python strict/test_matlab_bank_render.py
      - run: python strict/test_sensing_full_state_compare.py
      - run: python strict/test_sensing_closed_form_compare.py
      - run: python strict/mis-communications/test_figure_inputs.py
      - run: python strict/mis-sensing/test_figure_inputs.py
      - run: python strict/two-timescale-ma/test_correlated_derivatives.py
      - run: python strict/mis-communications/test_line_search.py
      - run: python strict/mis-communications/test_communication_increment.py
      - run: python strict/test_mis_parallel_bank.py
      - run: python strict/test_sensing_parallel_bank.py
      - run: python strict/mis-sensing/test_line_search.py
      - run: python strict/mis-sensing/test_normalization.py
      - run: python strict/mis-sensing/test_closed_form.py
      - run: python strict/mis-sensing/test_stable_increment.py
      - run: python strict/mis-sensing/test_solver_erratum.py
      - run: python strict/mis-sensing/test_pslr_increment.py
      - run: python strict/mis-sensing/test_self_excluded_sum.py
      - run: python strict/two-timescale-ma/test_coordinate_scaling.py
      - run: python strict/two-timescale-ma/test_exact_2d.py
      - run: python strict/two-timescale-ma/test_correlated_zf.py
      - run: python strict/cooperative-satcom/test_termination.py
      - name: Original non-Gaussian positive-moment limits
        run: python strict/cooperative-satcom/test_positive_wick.py
      - name: Restore actual complete91 cooperative endpoint data
        run: python tools/cooperative-stable-replay/unpack_evidence.py --archive strict/validation/cooperative-positive-wick-20261017/native91-positive-wick.tar.gz --expected-sha256 1cb56dd63f86613e6436c456cbf76bfe6c151c6410b0956f9a07e55281e199cc --output-dir strict/outputs/ci-cooperative91/unpacked
      - name: All8190 actual native gradient values versus retained MP80
        run: python tools/cooperative-stable-replay/audit_saved_components.py --fixture strict/outputs/ci-cooperative91/unpacked/inputs/original-all91-inputs.mat --references strict/outputs/ci-cooperative91/unpacked/inputs/references.json --native-dir strict/outputs/ci-cooperative91/unpacked/native --output strict/outputs/ci-cooperative91/native-audit.json
      - name: All8190 independent Python gradient values versus retained MP80
        run: python tools/cooperative-stable-replay/audit_saved_components.py --fixture strict/outputs/ci-cooperative91/unpacked/inputs/original-all91-inputs.mat --references strict/outputs/ci-cooperative91/unpacked/inputs/references.json --output strict/outputs/ci-cooperative91/python-audit.json
      - name: Actual failed full-size AP QT input versus independent MP80 and original Python solve
        run: python tools/cooperative-stable-replay/audit_ap_qt.py --input strict/validation/cooperative-ap-soc-20261017/actual-failed-AP-QT-input.mat --native-output strict/validation/cooperative-ap-soc-20261017/actual-scaled-AP-QT-output.mat --output strict/outputs/ci-cooperative91/actual-AP-QT-audit.json
      - name: Restore actual complete original native case and unchanged-output control
        run: python tools/cooperative-stable-replay/unpack_evidence.py --archive strict/validation/cooperative-ap-soc-20261017/native-case000-recording.tar.gz --expected-sha256 3d32975f05c86d4ef2d2de1922aa87a55d723857f24b9e112389581360b1e7d3 --output-dir strict/outputs/ci-cooperative91/full-native-case
      - name: All8 states, all47 phase stops and all31 actual QT candidates
        run: python tools/cooperative-stable-replay/audit_native_case.py --result strict/outputs/ci-cooperative91/full-native-case/case-000-matlab.json --before-recording strict/outputs/ci-cooperative91/full-native-case/before-recording-case000.json --output strict/outputs/ci-cooperative91/actual-full-native-case-audit.json
      - name: All47 newly recorded native phase contexts at MP80 and MP100
        run: python tools/cooperative-stable-replay/audit_native_phase_mp.py --result strict/outputs/ci-cooperative91/full-native-case/case-000-matlab.json --output-dir strict/outputs/ci-cooperative91/new47-MP80-MP100
      - name: All80 actual full-size ISAC failed trials with independent MP physics
        run: python tools/isac-line-search-replay/audit_failure.py --capture strict/validation/isac045-actual-line-search-20261017 --output-dir strict/outputs/ci-isac-actual80/MP80-MP100
      - name: All original W RIS rotation derivatives at the actual ISAC failure state
        run: python tools/isac-line-search-replay/audit_stable_derivatives.py --capture strict/validation/isac045-actual-line-search-20261017 --output strict/outputs/ci-isac-actual80/stable-all-gradient-audit.json
      - name: Original remaining phase budget retains unconverged outcome
        run: python tools/isac-line-search-replay/continue_phase.py --capture strict/validation/isac045-actual-line-search-20261017 --output-dir strict/outputs/ci-isac-actual80/original-budget-suffix
      - run: python strict/hotspot-satcom/test_termination.py
      - run: python strict/hotspot-satcom/test_phase_method.py
      - name: Author-source Rician coefficient contradiction (exact algebra, no simulation)
        run: python strict/hotspot-satcom/test_rician_source_coefficient.py
      - run: python strict/hotspot-satcom/test_source_contract.py
      - run: python strict/hotspot-satcom/verify_statistical.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-raw-pr-theory-scope-components-not-scene-reproduction
          path: strict/outputs/ci-raw-pr-scope/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-algorithm-component-evidence-not-full-reproduction
          path: strict/outputs/ci-components/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parameter-table-mappings-not-full-figure-certification
          path: strict/outputs/ci-parameter-tables/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-full12000-MIS-summary-replay-not-physical-or-full-reproduction
          path: strict/outputs/ci-mis-summary-replay/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-native18-MP80-MP100-endpoints-not-full-trajectory-reproduction
          path: strict/outputs/ci-native-statistical-endpoints/mp-audit/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-cooperative91-endpoints-not-complete-native183-figures
          path: |
            strict/outputs/ci-cooperative91/native-audit.json
            strict/outputs/ci-cooperative91/python-audit.json
            strict/outputs/ci-cooperative91/actual-AP-QT-audit.json
            strict/outputs/ci-cooperative91/actual-full-native-case-audit.json
            strict/outputs/ci-cooperative91/new47-MP80-MP100/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-ISAC80-failure-physics-not-full-convergence
          path: strict/outputs/ci-isac-actual80/
