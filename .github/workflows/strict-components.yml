name: Original-algorithm component checks (not full reproduction)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r strict/requirements.txt
      - run: python strict/validate_components.py --output-dir strict/outputs/ci-components
      - run: python strict/rotatable-isac/test_metadata.py
      - run: python strict/two-timescale-ma/test_metadata.py
      - run: python strict/test_validation.py
      - name: All MIS start-summary slots (not independent physical certification)
        run: python strict/test_mis_population_evidence.py
      - name: Actual saved full12000 MIS summaries and renderer (not fresh optimization)
        run: python strict/validation/mis-summary-population-gate-v2/audit_saved_bank.py --output-dir strict/outputs/ci-mis-summary-replay
      - run: python -m unittest discover -s strict -p test_figures.py
      - run: python strict/test_satellite_figures.py
      - run: python strict/test_reproduction_plans.py
      - name: Parameter-table route and source guards (metadata only)
        run: python strict/test_table_reproduction.py
      - name: Source-qualified parameter mappings (not full figure certification)
        run: python strict/validation/parameter-tables-source-qualified-v1/audit_tables.py --output strict/outputs/ci-parameter-tables/actual-canonical-parameter-replay.json
      - run: python strict/test_hotspot_element_count.py
      - run: python strict/test_hotspot_statistical_reference.py
      - run: python strict/test_matlab_bank_render.py
      - run: python strict/test_sensing_full_state_compare.py
      - run: python strict/test_sensing_closed_form_compare.py
      - run: python strict/mis-communications/test_figure_inputs.py
      - run: python strict/mis-sensing/test_figure_inputs.py
      - run: python strict/two-timescale-ma/test_correlated_derivatives.py
      - run: python strict/mis-communications/test_line_search.py
      - run: python strict/mis-communications/test_communication_increment.py
      - run: python strict/test_mis_parallel_bank.py
      - run: python strict/test_sensing_parallel_bank.py
      - run: python strict/mis-sensing/test_line_search.py
      - run: python strict/mis-sensing/test_normalization.py
      - run: python strict/mis-sensing/test_closed_form.py
      - run: python strict/mis-sensing/test_stable_increment.py
      - run: python strict/mis-sensing/test_solver_erratum.py
      - run: python strict/mis-sensing/test_pslr_increment.py
      - run: python strict/mis-sensing/test_self_excluded_sum.py
      - run: python strict/two-timescale-ma/test_coordinate_scaling.py
      - run: python strict/two-timescale-ma/test_exact_2d.py
      - run: python strict/two-timescale-ma/test_correlated_zf.py
      - run: python strict/cooperative-satcom/test_termination.py
      - run: python strict/hotspot-satcom/test_termination.py
      - run: python strict/hotspot-satcom/test_phase_method.py
      - run: python strict/hotspot-satcom/test_source_contract.py
      - run: python strict/hotspot-satcom/verify_statistical.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-algorithm-component-evidence-not-full-reproduction
          path: strict/outputs/ci-components/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parameter-table-mappings-not-full-figure-certification
          path: strict/outputs/ci-parameter-tables/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-full12000-MIS-summary-replay-not-physical-or-full-reproduction
          path: strict/outputs/ci-mis-summary-replay/
