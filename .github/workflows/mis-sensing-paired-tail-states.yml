name: Complete paired MIS sensing tail final states
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  sensing-paired-final-states:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the tested binary64 runtime
        run: python -m pip install -r tools/sensing-tail-paired-replay/requirements.txt
      - name: All 2000 complete final states, original stops, initializer contracts and rejected controls
        run: python -B tools/sensing-tail-paired-replay/replay_packet.py --output-dir "${{ runner.temp }}/mis-sensing-paired-tail"
      - name: Retain all complete fresh numerical fields and original outcome checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mis-sensing-tail1000-complete-paired-final-states-${{ github.run_id }}
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mis-sensing-paired-tail/summary.json
            ${{ runner.temp }}/mis-sensing-paired-tail/progress.json
            ${{ runner.temp }}/mis-sensing-paired-tail/all1000-initializer-source-contract-replay.json
            ${{ runner.temp }}/mis-sensing-paired-tail/actual-complete-paired-state-stop-physics-and-scope-negative-controls.json
            ${{ runner.temp }}/mis-sensing-paired-tail/fresh-final-fields/**
            ${{ runner.temp }}/mis-sensing-paired-tail/fresh-paired-records/**
